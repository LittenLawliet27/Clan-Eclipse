```
<title>Clan Eclipse | Access Denied</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        height: 100%;
    }

    body {
        overflow: hidden;
        background: #000;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
    }

    /* Eclipse transition overlay */

    .eclipse-transition {
        position: fixed;
        inset: 0;

        z-index: 10;

        background: #000;

        display: flex;
        align-items: center;
        justify-content: center;

        animation: fadeOut 2s ease forwards;
        pointer-events: none;
    }

    .eclipse-ring {
        width: 25px;
        height: 25px;

        border-radius: 50%;

        background: #000;

        box-shadow:
            0 0 10px #9333ea,
            0 0 30px #7e22ce,
            0 0 70px #6d28d9,
            0 0 120px rgba(147, 51, 234, .8);

        animation: eclipseExpand 1.8s ease forwards;
    }

    @keyframes eclipseExpand {
        0% {
            width: 25px;
            height: 25px;
        }

        100% {
            width: 250vmax;
            height: 250vmax;
        }
    }

    @keyframes fadeOut {
        0% {
            opacity: 1;
        }

        70% {
            opacity: 1;
        }

        100% {
            opacity: 0;
        }
    }

    /* GIF */

    .gif-container {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #000;
    }

    .gif-container img {
        width: 100vw;
        height: 100vh;

        object-fit: contain;

        display: block;
    }

    /* Eclipse border */

    .edge-glow {
        position: fixed;
        inset: 0;

        pointer-events: none;

        z-index: 5;

        box-shadow:
            inset 0 0 80px rgba(126, 34, 206, .45),
            inset 0 0 180px rgba(0, 0, 0, .8);
    }

    /* Warning text */

    .warning {
        position: fixed;

        top: 25px;
        left: 50%;

        transform: translateX(-50%);

        z-index: 6;

        color: white;

        font-size: 13px;
        font-weight: bold;

        letter-spacing: 4px;

        text-transform: uppercase;

        text-shadow:
            0 0 10px #9333ea,
            0 0 25px #7e22ce;

        opacity: 0;

        animation: warningIn 1s ease 1.8s forwards;
    }

    @keyframes warningIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    /* Mobile */

    @media (max-width: 600px) {

        .warning {
            font-size: 10px;
            letter-spacing: 2px;
        }
    }
</style>
```

</head>

<body>

```
<!-- Eclipse transition -->

<div class="eclipse-transition">
    <div class="eclipse-ring"></div>
</div>

<!-- Fullscreen GIF -->

<div class="gif-container">
    <img
        src="you-are-an-idiot.gif"
        alt="Access denied"
    >
</div>

<!-- Purple Eclipse edge glow -->

<div class="edge-glow"></div>

<div class="warning">
    Clan Eclipse • Access Denied
</div>
