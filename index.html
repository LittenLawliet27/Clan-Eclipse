<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clan Eclipse | Access</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: white;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at 50% 45%, rgba(145, 45, 255, .35), transparent 32%),
                linear-gradient(135deg, #030305, #170522 45%, #3a0860 70%, #030305);
        }

        .eclipse {
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: #020203;
            box-shadow:
                0 0 30px #8b3dff,
                0 0 80px #7027d8,
                0 0 150px rgba(168, 85, 247, .4);
            z-index: 0;
        }

        .eclipse::after {
            content: "";
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 2px solid rgba(168, 85, 247, .5);
        }

        .panel {
            position: relative;
            z-index: 2;
            width: min(90%, 500px);
            padding: 45px 35px;
            text-align: center;

            background: rgba(5, 5, 8, .88);
            border: 1px solid rgba(168, 85, 247, .5);
            border-radius: 22px;
            backdrop-filter: blur(15px);

            box-shadow: 0 0 40px rgba(124, 45, 255, .25);
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #050507;
            border: 2px solid #a855f7;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;

            box-shadow:
                0 0 20px #7e22ce,
                0 0 45px rgba(168, 85, 247, .45);
        }

        h1 {
            font-size: 42px;
            letter-spacing: 8px;

            background: linear-gradient(90deg, #fff, #d8b4fe, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            margin-top: 8px;
            color: #ad9bb8;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .divider {
            width: 80px;
            height: 2px;
            margin: 25px auto;

            background: linear-gradient(
                90deg,
                transparent,
                #a855f7,
                transparent
            );
        }

        .message {
            color: #d6cbe0;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input {
            width: 100%;
            padding: 15px;

            border: 1px solid #5b21b6;
            border-radius: 10px;

            background: rgba(0, 0, 0, .6);
            color: white;

            outline: none;
            text-align: center;
            font-size: 15px;
            letter-spacing: 2px;
        }

        input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, .4);
        }

        button {
            padding: 15px;
            border: 0;
            border-radius: 10px;

            background: linear-gradient(90deg, #6d28d9, #9333ea);
            color: white;

            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;

            transition: .2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(168, 85, 247, .6);
        }

        .denied {
            display: none;
            margin-top: 15px;
            color: #d8b4fe;
            font-size: 12px;
            letter-spacing: 2px;
        }

        footer {
            margin-top: 25px;
            color: #665a6d;
            font-size: 10px;
            letter-spacing: 2px;
        }

        @media (max-width: 600px) {
            .eclipse {
                width: 290px;
                height: 290px;
            }

            .panel {
                padding: 35px 25px;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="eclipse"></div>

    <main class="panel">

        <div class="logo">🌑</div>

        <h1>ECLIPSE</h1>

        <div class="subtitle">
            Clan Eclipse
        </div>

        <div class="divider"></div>

        <p class="message">
            Welcome to the official Clan Eclipse website.
            <br><br>
            Enter your access code to enter the Eclipse.
        </p>

        <form id="accessForm">
            <input
                id="accessCode"
                type="password"
                placeholder="ACCESS CODE"
                autocomplete="off"
                required
            >

            <button type="submit">
                ENTER ECLIPSE
            </button>
        </form>

        <div class="denied" id="denied">
            ACCESS DENIED — REDIRECTING...
        </div>

        <footer>
            CLAN ECLIPSE • UNITY IN THE DARK
        </footer>

    </main>

    <script>
        const ACCESS_CODE = "Voided";

        document.getElementById("accessForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const input = document.getElementById("accessCode");
            const denied = document.getElementById("denied");

            if (input.value === ACCESS_CODE) {
                // Correct code → Clan Eclipse homepage
                window.location.href = "home.html";
            } else {
                // Incorrect code → show message, then open the uploaded denied image
                denied.style.display = "block";
                input.disabled = true;
                document.querySelector("button").disabled = true;

                setTimeout(function() {
                    window.location.href = "denied.png";
                }, 1000);
            }
        });
    </script>

</body>
</html>
